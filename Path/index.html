<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sankar Group - Hybrid Voice Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 font-sans min-h-screen flex flex-col justify-between">

    <header class="bg-indigo-600 text-white shadow-md p-4 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-robot text-2xl"></i>
            <h1 class="text-xl font-bold tracking-wide">SANKAR <span class="text-indigo-200 font-normal text-sm">GROUP</span></h1>
        </div>
        <span class="bg-indigo-700 px-3 py-1 rounded-full text-xs font-semibold tracking-wider">HI-TE VOICE BOT</span>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col md:flex-row gap-4 h-[calc(100vh-140px)]">
        
        <div class="flex-1 bg-white rounded-2xl shadow-sm border border-slate-200 p-4 flex flex-col justify-between h-[60vh] md:h-full">
            
            <div id="chat-window" class="flex-1 overflow-y-auto space-y-3 pr-2 mb-4">
                <div class="flex items-start gap-2.5 max-w-[85%]">
                    <div class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold text-sm shadow-sm">B</div>
                    <div class="bg-slate-100 text-slate-800 p-3 rounded-2xl rounded-tl-none text-sm shadow-sm">
                        Namaste! Aapka swagat hai Sankar Group mein. Meeku software demo kavala? Ya aapko koi aur help chahiye?
                    </div>
                </div>
            </div>

            <div id="live-transcript-box" class="hidden bg-amber-50 border border-amber-200 text-amber-800 text-sm px-4 py-2.5 rounded-xl mb-1 flex items-center gap-2">
                <span class="flex h-2 w-2 relative">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-amber-500"></span>
                </span>
                <span class="italic text-xs font-bold whitespace-nowrap">Listening:</span>
                <span id="live-transcript" class="font-normal truncate">...</span>
            </div>
        </div>

        <div class="w-full md:w-80 bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col justify-between items-center text-center">
            <div class="w-full flex flex-col items-center">
                <h3 class="text-lg font-bold text-slate-800 mb-1">Voice Controller</h3>
                <p class="text-xs text-slate-500 mb-8">Speak naturally combining Hindi & Telugu expressions.</p>
                
                <button id="mic-btn" style="background-color: #4f46e5;" class="w-36 h-36 rounded-full text-white flex flex-col items-center justify-center gap-2 shadow-lg hover:shadow-indigo-200 transition-all border-4 border-indigo-100 focus:outline-none group">
                    <i id="mic-icon" class="fa-solid fa-microphone text-3xl group-hover:scale-110 transition-transform"></i>
                    <span id="mic-status" class="text-xs font-semibold tracking-wide">Tap to Speak</span>
                </button>
            </div>

            <div class="w-full mt-6 border-t border-slate-100 pt-6">
                <p class="text-xs text-slate-400 mb-2">Repeat Last Audio Output</p>
                <button id="play-tts-btn" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 py-2.5 px-4 rounded-xl text-sm font-medium flex items-center justify-center gap-2 transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    <i class="fa-solid fa-volume-high"></i> Play Bot Response
                </button>
            </div>
        </div>
    </main>

    <footer class="bg-slate-100 border-t border-slate-200 text-center p-3 text-xs text-slate-500">
        &copy; 2026 Sankar Group Voice Systems.
    </footer>

    <script>
        const BACKEND_URL = "http://127.0.0.1:1000/api/chat";
        // Unique random sequence to manage persistent conversation context logging session boundaries
        const sessionId = "session_" + Math.random().toString(36).substring(2, 11);
        
        let lastBotResponseText = "";
        let isListening = false;
        let recognition;

        const micBtn = document.getElementById('mic-btn');
        const micStatus = document.getElementById('mic-status');
        const liveTranscriptBox = document.getElementById('live-transcript-box');
        const liveTranscript = document.getElementById('live-transcript');
        const chatWindow = document.getElementById('chat-window');
        const playTtsBtn = document.getElementById('play-tts-btn');

        // Check Web Architecture Speech Synthesis Compatibility Hooks 
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            
            recognition.continuous = false; // Processes and packages chunk blocks when pauses are detected
            recognition.interimResults = true; // Flushes half-formed live speech results into UI immediately
            recognition.lang = 'hi-IN'; // Setting regional Indian standard locale catches mixed Hindi + Telugu dictation loops smoothly

            // Triggered exactly when system sound device stream initiates successfully
            recognition.onstart = function() {
                isListening = true;
                micBtn.style.backgroundColor = "#ef4444"; // Red for listening state
                micStatus.innerText = "Listening... Speak now!";
                liveTranscriptBox.classList.remove('hidden');
                liveTranscript.innerText = "...";
            };

            // Flushes and converts streaming audio variations into live display data arrays
            recognition.onresult = function(event) {
                let textBuffer = "";
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    textBuffer += event.results[i][0].transcript;
                }
                liveTranscript.innerText = textBuffer;
            };

            // Catches any hardware exceptions natively logged by user platform setup
            recognition.onerror = function(event) {
                console.error("Hardware STT Exception Caught:", event.error);
                if (event.error === 'not-allowed') {
                    alert("Microphone Access Blocked! Click the padlock or sliders button on the left side of your Chrome URL address bar and change Microphone permission to 'Allow'.");
                }
                stopListening();
            };

            // Process payload on streaming audio termination
            recognition.onend = function() {
                const capturedSpeechText = liveTranscript.innerText.trim();
                stopListening();
                
                if (capturedSpeechText && capturedSpeechText !== "...") {
                    appendChatBubble('User', capturedSpeechText);
                    sendRequestToBackend(capturedSpeechText);
                }
            };
        } else {
            alert("This browser engine lacks native Web Speech tracking modules. Please run this index.html file inside Google Chrome.");
        }

        // Swaps running hardware capture lifecycle configurations
        function toggleMicState() {
            if (isListening) {
                recognition.stop();
            } else {
                window.speechSynthesis.cancel(); // Stops previous voice loops instantly if user interrupts
                try {
                    recognition.start();
                } catch (error) {
                    console.error("Context lifecycle start error:", error);
                }
            }
        }

        // Returns interface elements cleanly back to baseline waiting positions
        function stopListening() {
            isListening = false;
            micBtn.style.backgroundColor = "#4f46e5"; // Indigo Blue for waiting state
            micStatus.innerText = "Tap to Speak";
            liveTranscriptBox.classList.add('hidden');
        }

        // Dispatches the final captured plaintext to the local FastAPI Python runtime service
        async function sendRequestToBackend(userMessage) {
            appendChatBubble('Loading', 'Thinking...');
            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId, message: userMessage })
                });
                
                const data = await response.json();
                document.getElementById('loading-bubble')?.remove();

                if (data.status === 'success') {
                    lastBotResponseText = data.bot_response;
                    appendChatBubble('Bot', lastBotResponseText);
                    playTextToSpeech(lastBotResponseText); // Automatically announce response
                    playTtsBtn.disabled = false;
                } else {
                    appendChatBubble('Bot', 'Server returned error status context payload flag.');
                }
            } catch (err) {
                document.getElementById('loading-bubble')?.remove();
                console.error("Network Fetch Boundary failure:", err);
                appendChatBubble('Bot', 'Connection Error. Please double check that your backend Python server is running (`python -m uvicorn main:app --reload`) on port 8000.');
            }
        }

        // Dynamically append conversation bubble items safely inside the document container interface
        function appendChatBubble(sender, contentString) {
            const dialogueRow = document.createElement('div');
            if (sender === 'User') {
                dialogueRow.className = "flex items-start gap-2.5 max-w-[85%] ml-auto flex-row-reverse";
                dialogueRow.innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center font-bold text-sm shadow-sm">U</div>
                    <div class="bg-emerald-600 text-white p-3 rounded-2xl rounded-tr-none text-sm shadow-md">${contentString}</div>
                `;
            } else if (sender === 'Loading') {
                dialogueRow.id = "loading-bubble";
                dialogueRow.className = "flex items-start gap-2.5 max-w-[85%]";
                dialogueRow.innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center font-bold text-sm">...</div>
                    <div class="bg-slate-100 text-slate-400 p-3 rounded-2xl rounded-tl-none text-sm italic animate-pulse shadow-sm">${contentString}</div>
                `;
            } else {
                dialogueRow.className = "flex items-start gap-2.5 max-w-[85%]";
                dialogueRow.innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold text-sm shadow-sm">B</div>
                    <div class="bg-slate-100 text-slate-800 p-3 rounded-2xl rounded-tl-none text-sm shadow-sm">${contentString}</div>
                `;
            }
            chatWindow.appendChild(dialogueRow);
            chatWindow.scrollTop = chatWindow.scrollHeight; // Focus screen window tracking downwards automatically
        }

        // Text-to-Speech Processing Core Engine Logic (TTS)
        function playTextToSpeech(targetText) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Cleans pending speech buffer logs instantly
                
                const responseSpeechUtterance = new SpeechSynthesisUtterance(targetText);
                responseSpeechUtterance.lang = 'hi-IN'; // Reads back combined code-switching scripts naturally
                responseSpeechUtterance.rate = 0.95;
                responseSpeechUtterance.pitch = 1.0;
                
                window.speechSynthesis.speak(responseSpeechUtterance);
            }
        }

        // Binding Interface Event Wire Links
        micBtn.addEventListener('click', toggleMicState);
        playTtsBtn.addEventListener('click', function() {
            playTextToSpeech(lastBotResponseText);
        });
    </script>
</body>
</html>
